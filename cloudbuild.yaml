# Cloud Build CI/CD pipeline for eve-jita-poller.
#
# Triggered by a GitHub push (set up via Console — see README's "Connect to GitHub + Cloud Build
# CI/CD" section, that part can't be scripted, it's an interactive OAuth consent flow). Builds
# the poller image, pushes it to Artifact Registry, and updates the existing Cloud Run Job to use
# the new image. Does NOT create the job or any other infra — run deploy.sh once first to set
# everything up, this file only automates step 7 (build) + the image part of step 9 (deploy) from
# then on.

steps:
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller:latest'
      - './poller'

  - id: push
    name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller'

  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - jobs
      - update
      - '${_JOB_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller:$SHORT_SHA'
      - '--region=${_REGION}'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/poller:latest'

# Defaults — override per-trigger in the Console if you ever need to (e.g. different region).
# Must match what deploy.sh actually created, or the `gcloud run jobs update` step will fail
# with "job not found".
substitutions:
  _REGION: europe-west1
  _AR_REPO: eve-jita-poller
  _JOB_NAME: eve-jita-poller

options:
  logging: CLOUD_LOGGING_ONLY
